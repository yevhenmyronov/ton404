name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # No install step: the suite imports the worker directly and uses nothing
      # but node built-ins, which is also why there is no package.json here.
      - run: node worker/test.mjs
