name = "blackhole"
main = "worker/src/index.js"
compatibility_date = "2025-07-01"

# Must stay explicit: adding a custom domain makes wrangler disable workers.dev
# by default (the old address would return error 1042), and links to it are
# already out in the wild.
workers_dev = true

# Otherwise every deployed version gets its own public URL — a third live host
# on the same Durable Object that nobody uses.
preview_urls = false

# The worker keeps its original name on purpose: it defines the workers.dev
# address, and renaming would kill it along with every shared link. The custom
# domain sits on top; custom_domain = true lets wrangler manage the DNS record.
[[routes]]
pattern = "nohair.dev"
custom_domain = true

# The page is served by the same worker — one origin, zero CORS between our own parts.
[assets]
directory = "./public"

# Gives the worker its deployed version id, so open tabs learn about new
# releases instead of running stale code for weeks.
[version_metadata]
binding = "CF_VERSION"

# Free worker logs; without them the first incident gets debugged blind.
[observability]
enabled = true

[[durable_objects.bindings]]
name = "HOLE"
class_name = "BlackHole"

# The SQLite flavor is the only one available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["BlackHole"]
